<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkiv | Iniciar Sesión</title>
    <!-- Favicon Oficial "A" Triangular ARKIV -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231e293b'/><path d='M50 18 L22 78 L34 78 L42 60 L58 60 L66 78 L78 78 Z M50 36 L55 48 L45 48 Z' fill='%23ffffff'/><circle cx='50' cy='42' r='4' fill='%2306b6d4'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0c1322; }
        .g-recaptcha { display: flex; justify-content: center; transform: scale(0.92); transform-origin: center; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-blue-600 selection:text-white">

    <div class="w-full max-w-sm bg-white rounded-[2rem] p-8 shadow-2xl relative text-slate-800">
        
        <!-- Logo Oficial "A" -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#1e293b] shadow-md shadow-slate-900/20 mb-3">
                <svg class="w-10 h-10" viewBox="0 0 100 100">
                    <path d="M50 18 L22 78 L34 78 L42 60 L58 60 L66 78 L78 78 Z M50 36 L55 48 L45 48 Z" fill="#ffffff"/>
                    <circle cx="50" cy="42" r="4" fill="#06b6d4"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Arkiv</h1>
            <p class="text-[11px] font-bold tracking-wider text-slate-400 uppercase mt-0.5">DOCUMENTOS Y ARCHIVO</p>
        </div>

        {% if mensaje_expirado %}
            <div class="mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>{{ mensaje_expirado }}</span>
            </div>
        {% endif %}

        {% if error %}
            <div class="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4" id="loginForm">
            <!-- 🛡️ CSRF Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">USUARIO</label>
                <input type="text" 
                       name="usuario" 
                       required 
                       autofocus 
                       placeholder="Ej: admin" 
                       class="w-full px-4 py-2.5 bg-slate-100/80 border border-slate-200/80 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-slate-500">CONTRASEÑA</label>
                    <a href="{{ url_for('recuperar_clave') }}" class="text-[11px] text-blue-600 hover:text-blue-700 font-semibold transition-colors">¿Olvidaste tu clave?</a>
                </div>
                <div class="relative">
                    <input type="password" 
                           id="passwordInput" 
                           name="contrasena" 
                           required 
                           placeholder="••••" 
                           class="w-full px-4 py-2.5 pr-10 bg-slate-100/80 border border-slate-200/80 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="pt-1 flex justify-center overflow-hidden">
                <div class="g-recaptcha" data-sitekey="6LcU0mAtAAAAAOj_aciK31VM2nAuECZQe0-G36Ph"></div>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
                <span>Iniciar Sesión &rarr;</span>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center space-y-1">
            <p class="text-[11px] text-slate-400 flex items-center justify-center gap-1">
                <span>🔒</span> Conexión segura y cifrada
            </p>
            <p class="text-[11px] text-slate-400">
                <span class="text-blue-600 font-semibold bg-blue-50 px-1.5 py-0.5 rounded">v1.3.0 Pro</span> &bull; Powered by <strong class="text-slate-600">MosSoft</strong>
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('passwordInput');
            const passIcon = document.getElementById('togglePasswordIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                passIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
