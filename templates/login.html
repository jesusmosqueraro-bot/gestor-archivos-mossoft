<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKIV - Iniciar Sesión</title>
    <!-- Favicon "A" Elegante -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2306b6d4'/><stop offset='100%25' stop-color='%232563eb'/></linearGradient></defs><rect width='100' height='100' rx='28' fill='url(%23grad)'/><text x='50%25' y='68%25' font-family='sans-serif' font-weight='900' font-size='60' fill='%23ffffff' text-anchor='middle'>A</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        .g-recaptcha { display: flex; justify-content: center; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-white bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#0b0f19] to-black">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/80 rounded-3xl p-8 shadow-2xl backdrop-blur-xl relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Logo con la "A" Elegante -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20 text-white text-3xl font-black mb-4 tracking-tighter">
                A
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white">ARKIV</h1>
            <p class="text-slate-400 text-sm mt-1 font-medium">Gestor Inteligente de Archivos y Procesos</p>
        </div>

        {% if mensaje_expirado %}
            <div class="mb-5 p-4 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-sm flex items-center gap-3">
                <i class="fa-solid fa-triangle-exclamation text-base flex-shrink-0"></i>
                <span>{{ mensaje_expirado }}</span>
            </div>
        {% endif %}

        {% if error %}
            <div class="mb-5 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm flex items-center gap-3">
                <i class="fa-solid fa-circle-exclamation text-base flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-5" id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                    <input type="text" name="usuario" required autofocus autocomplete="username" placeholder="Ingresa tu usuario" class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-300">Contraseña</label>
                    <a href="{{ url_for('recuperar_clave') }}" class="text-xs text-cyan-400 hover:text-cyan-300 transition-colors font-medium">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="passwordInput" name="contrasena" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-11 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 hover:text-slate-300">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="pt-1 flex justify-center overflow-hidden">
                <div class="g-recaptcha" data-sitekey="6LcU0mAtAAAAAOj_aciK31VM2nAuECZQe0-G36Ph" data-theme="dark"></div>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2 group">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
            <p class="text-xs text-slate-500">ARKIV System &bull; Versión Protegida 2.0</p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('passwordInput');
            const passIcon = document.getElementById('togglePasswordIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                passIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
