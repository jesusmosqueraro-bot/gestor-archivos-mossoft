<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKIV - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google reCAPTCHA v2 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
        .g-recaptcha {
            transform: scale(0.95);
            transform-origin: 0 0;
        }
        @media (max-width: 400px) {
            .g-recaptcha {
                transform: scale(0.85);
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-white bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#0b0f19] to-black">

    <!-- Tarjeta Principal del Login -->
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/80 rounded-3xl p-8 shadow-2xl backdrop-blur-xl relative overflow-hidden">
        
        <!-- Luz ambiental decorativa -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Encabezado / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20 text-white text-2xl mb-4">
                <i class="fa-solid fa-box-archive"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white">ARKIV</h1>
            <p class="text-slate-400 text-sm mt-1 font-medium">Gestor Inteligente de Archivos y Procesos</p>
        </div>

        <!-- Alertas de Error o Expiración -->
        {% if mensaje_expirado %}
            <div class="mb-5 p-4 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-sm flex items-center gap-3 animate-fade-in">
                <i class="fa-solid fa-triangle-exclamation text-base flex-shrink-0"></i>
                <span>{{ mensaje_expirado }}</span>
            </div>
        {% endif %}

        {% if error %}
            <div class="mb-5 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm flex items-center gap-3 animate-fade-in">
                <i class="fa-solid fa-circle-exclamation text-base flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <!-- Formulario de Acceso -->
        <form method="POST" action="{{ url_for('login') }}" class="space-y-5" id="loginForm">
            <!-- 🛡️ Token de Protección CSRF (Requerido por Flask-WTF) -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <!-- Campo Usuario -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
                    Usuario
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-regular fa-user text-sm"></i>
                    </span>
                    <input type="text" 
                           name="usuario" 
                           required 
                           autofocus
                           autocomplete="username"
                           placeholder="Ingresa tu usuario" 
                           class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors">
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Contraseña
                    </label>
                    <a href="{{ url_for('recuperar_clave') }}" class="text-xs text-cyan-400 hover:text-cyan-300 transition-colors font-medium">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" 
                           id="passwordInput"
                           name="contrasena" 
                           required 
                           autocomplete="current-password"
                           placeholder="••••••••" 
                           class="w-full pl-10 pr-11 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors">
                    
                    <!-- Botón Mostrar/Ocultar Contraseña -->
                    <button type="button" 
                            id="togglePasswordBtn"
                            onclick="togglePassword()"
                            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 hover:text-slate-300 transition-colors focus:outline-none">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Google reCAPTCHA v2 (Tema Oscuro) -->
            <div class="pt-1 flex justify-center">
                <div class="g-recaptcha" 
                     data-sitekey="6LcU0mAtAAAAAIdZ43K_jPjU8nJ950Fq53nF6pP5" 
                     data-theme="dark"></div>
            </div>

            <!-- Botón de Ingreso -->
            <button type="submit" 
                    id="submitBtn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/30 transition-all duration-200 flex items-center justify-center gap-2 group">
                <span>Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <!-- Pie de tarjeta -->
        <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
            <p class="text-xs text-slate-500">
                ARKIV System &bull; Versión Protegida 2.0
            </p>
        </div>
    </div>

    <!-- Script de Visibilidad de Contraseña -->
    <script>
        function togglePassword() {
            const passInput = document.getElementById('passwordInput');
            const passIcon = document.getElementById('togglePasswordIcon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.classList.remove('fa-eye');
                passIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                passIcon.classList.remove('fa-eye-slash');
                passIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
