<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARKIV - Recuperar Contraseña</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1329'/><path d='M50 20 L20 80 L38 80 L50 60 L62 80 L80 80 Z' fill='%23e2e8f0'/><path d='M50 20 L80 80 L62 80 L50 60 Z' fill='%2364748b'/><path d='M50 35 L62 55 L38 55 Z' fill='%230b1329'/><path d='M50 38 L58 50 L42 50 Z' fill='%2338bdf8'/><circle cx='50' cy='46' r='3' fill='white'/><path d='M35 60 L65 60 L50 56 Z' fill='%23e2e8f0'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="min-h-screen bg-[#0b0f19] text-slate-100 flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative">
        
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-[#1e293b] flex items-center justify-center shadow-lg border border-slate-700/50">
                <svg class="w-8 h-8" viewBox="0 0 100 100">
                    <path d="M50 18 L22 78 L34 78 L42 60 L58 60 L66 78 L78 78 Z M50 36 L55 48 L45 48 Z" fill="#ffffff"/>
                    <circle cx="50" cy="42" r="4" fill="#06b6d4"/>
                </svg>
            </div>
        </div>

        <h2 class="text-xl font-bold text-center text-white mb-1">Recuperar Contraseña</h2>
        <p class="text-xs text-center text-slate-400 mb-6">Ingresa tu correo para recibir un código de verificación.</p>

        {% if error %}
        <div class="p-3 mb-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold text-center">
            {{ error }}
        </div>
        {% endif %}

        {% if exito %}
        <div class="p-3 mb-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold text-center">
            {{ exito }}
        </div>
        {% endif %}

        {% if paso == 1 or not paso %}
        <!-- PASO 1: Enviar Correo -->
        <form method="POST" action="{{ url_for('recuperar_clave') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Correo Electrónico</label>
                <input type="email" name="email" required placeholder="ejemplo@correo.com" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-cyan-500/20 transition-all">
                Enviar Código de Verificación
            </button>
        </form>
        {% else %}
        <!-- PASO 2: Validar Código y Cambiar Clave -->
        <form method="POST" action="{{ url_for('validar_codigo') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Código de Verificación (6 dígitos)</label>
                <input type="text" name="codigo" required maxlength="6" placeholder="123456" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-center tracking-widest font-mono text-white focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nueva Contraseña</label>
                <input type="password" name="nueva_password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-emerald-500/20 transition-all">
                Actualizar Contraseña
            </button>
        </form>
        {% endif %}

        <div class="mt-6 text-center">
            <a href="{{ url_for('login') }}" class="text-xs text-slate-400 hover:text-cyan-400 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>

</body>
</html>
