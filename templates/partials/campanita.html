<!-- 🔔 CAMPANITA DE NOTIFICACIONES — parcial compartido por todas las páginas autenticadas.
     Se incluye con una directiva Jinja "include" dentro del nav/header de cada plantilla;
     su comportamiento (consultar /notificaciones/resumen, pintar el contador y la lista,
     marcar como leídas) vive en /static/js/notificaciones.js, que cada plantilla debe
     cargar una sola vez antes de cerrar el body. -->
<div class="relative" id="wrapper-notificaciones">
    <button type="button" id="btn-notificaciones" onclick="toggleNotificaciones()" class="relative bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-xl transition-all text-xs" title="Notificaciones">
        <i class="fa-solid fa-bell"></i>
        <span id="badge-notificaciones" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold rounded-full min-w-[16px] h-4 flex items-center justify-center px-1">0</span>
    </button>
    <div id="dropdown-notificaciones" class="hidden absolute right-0 mt-2 w-80 max-w-[90vw] bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl z-50 overflow-hidden">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-slate-700/60">
            <span class="text-xs font-bold text-white">Notificaciones</span>
            <button type="button" onclick="marcarTodasLeidas()" class="text-[10px] text-sky-400 hover:text-sky-300 font-bold">Marcar todas leídas</button>
        </div>
        <div id="lista-notificaciones" class="max-h-80 overflow-y-auto divide-y divide-slate-700/40">
            <p class="text-slate-500 text-center text-[11px] py-6">Cargando...</p>
        </div>
    </div>
</div>
