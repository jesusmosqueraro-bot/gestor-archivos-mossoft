<!-- ❓ AYUDA CONTEXTUAL — parcial reusable, un botón "?" por página que abre un panel con la
     ayuda de ESE módulo puntual (qué es, para quién, pasos para usarlo y preguntas
     frecuentes) — a diferencia del buscador (que busca contenido) o de un manual único y
     centralizado, esta es ayuda específica de la página en la que está el usuario. Pedido por
     Tomás (13/09/2026): "habilitar un boton de ayuda... manual instructivo de las
     funcionalidades de Arkiv". El contenido vive en /static/js/ayuda-modulo.js, indexado por
     la clave que cada plantilla pasa en la variable 'modulo' antes de este include, así:
       {% raw %}{% with modulo='tickets' %}{% include 'partials/ayuda_modulo.html' %}{% endwith %}{% endraw %}
     Como cada plantilla solo es alcanzable por quien ya tiene permiso de ver ese módulo (la
     ruta de Flask ya lo exige), el botón queda ajustado al rol de quien lo ve sin lógica
     adicional aquí. El modal en sí es genérico (mismo markup en toda la app); solo cambia qué
     clave de AYUDA_MODULOS le pasa el botón al abrir. -->
<div class="relative" id="wrapper-ayuda-modulo">
    <button type="button" data-ayuda-modulo="{{ modulo }}" onclick="abrirAyudaModulo(this.dataset.ayudaModulo)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-xl transition-all text-xs" title="Ayuda de este módulo">
        <i class="fa-solid fa-circle-question"></i>
    </button>
</div>

<div id="modal-ayuda-modulo" class="hidden fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-start justify-center p-4 pt-16 sm:pt-24">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden max-h-[80vh] flex flex-col">
        <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-700/60 flex-none">
            <i class="fa-solid fa-circle-question text-emerald-400"></i>
            <h2 id="ayuda-modulo-titulo" class="flex-1 text-white font-bold text-sm"></h2>
            <button type="button" onclick="cerrarAyudaModulo()" class="text-slate-500 hover:text-slate-300 flex-none" title="Cerrar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="ayuda-modulo-contenido" class="overflow-y-auto px-5 py-4 text-sm">
        </div>
    </div>
</div>
