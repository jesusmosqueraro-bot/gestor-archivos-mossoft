<!-- 🔍 BUSCADOR GLOBAL — parcial compartido por todas las páginas autenticadas. Se incluye
     junto a la campanita de notificaciones en el nav/header de cada plantilla. Busca a la vez
     en Solicitudes TI, Comunicados, Base de Conocimiento, Gestor de Archivos, Bóveda de
     Accesos, Mi Bóveda Personal, Accesos de Colaboradores, Inventario de Activos, Proveedores,
     Áreas, Sedes, Categorías de Solicitudes, Mis Tareas, Actas de Recibido Biomédico,
     Plantillas de Solicitud, Vencimiento de Documentos, Certificación de Devoluciones,
     Usuarios, Geolocalización de Accesos, Chat Interno (Canal General + los directos propios),
     Indicadores / Power BI, Auditoría y Logs, Log de Correos Enviados y Respaldos de Base de
     Datos — cada categoría solo aparece si la cuenta que tiene la sesión abierta tiene permiso
     de ver ese módulo (la misma regla que ya aplica cada página por separado). Mi Bóveda
     Personal es la única transversal a TODOS los roles, incluido 'estandar' — el resto sigue
     reservado a admin/agente (o a Gestión Humana, en el caso puntual de Certificación de
     Devoluciones; o a la cuenta super-admin literal 'admin', en el caso de Respaldos de Base de
     Datos).
     Certificación de Devoluciones, desde el 19/09/2026, también la ve una cuenta 'estandar' con
     el permiso extra 'devoluciones' (ver MODULOS_ASIGNABLES), no solo admin/agente/gestion_humana.
     Igual de transversal (permiso extra 'reportes'/'auditoria') son Indicadores / Power BI y
     Auditoría y Logs / Log de Correos Enviados — recorrido completo del aplicativo pedido por
     Tomás el 19/09/2026: "este botón debe funcionar de manera transversal siempre para que todo
     cambio se pueda buscar aquí". Respaldos de Base de Datos busca sobre los archivos .json del
     disco (ver _listar_respaldos() en app.py), no sobre una tabla — no hay registro en BD de
     cada respaldo en sí, pero cada ACCIÓN sobre Respaldos (generar/eliminar/cambiar frecuencia)
     ya queda registrada como una fila más en "Auditoría y Logs" vía registrar_log().
     Su comportamiento vive en /static/js/buscador.js. -->
<div class="relative" id="wrapper-buscador-global">
    <button type="button" id="btn-buscador-global" onclick="abrirBuscadorGlobal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-xl transition-all text-xs" title="Buscar en Arkiv">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>
</div>

<div id="modal-buscador-global" class="hidden fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-start justify-center p-4 pt-16 sm:pt-24">
    <div id="panel-buscador-global" class="w-full max-w-xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-700/60">
            <i class="fa-solid fa-magnifying-glass text-slate-500"></i>
            <input type="text" id="input-buscador-global" placeholder="Buscar solicitudes, comunicados, documentos..." class="flex-1 bg-transparent text-white text-sm focus:outline-none placeholder:text-slate-500" autocomplete="off">
            <button type="button" onclick="cerrarBuscadorGlobal()" class="text-slate-500 hover:text-slate-300 flex-none" title="Cerrar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="resultados-buscador-global" class="max-h-[28rem] overflow-y-auto">
            <p class="text-slate-500 text-center text-[11px] py-8">Escribe al menos 2 letras para buscar en Arkiv...</p>
        </div>
    </div>
</div>
