<!DOCTYPE html>
<html lang="es" data-theme="{{ session.get('tema') if session.get('tema') in ('claro', 'descanso') else 'oscuro' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arkiv | {{ reporte.titulo }}</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/tema-claro.css">
    <link rel="stylesheet" href="/static/css/tema-descanso.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/marca-institucional.css">
    {% include 'partials/colores_modal_personalizados.html' %}
</head>
<body class="pagina-acento-blue bg-slate-900 min-h-screen text-slate-100 flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-40 px-4 py-3 sm:px-8 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="{{ url_for('listar_powerbi') }}" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2 rounded-xl transition-all text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>
            <div class="h-6 w-px bg-slate-700"></div>
            <h1 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-blue-400"></i> {{ reporte.titulo }}
            </h1>
        </div>
        <div class="flex items-center gap-2">
            {% include 'partials/logo_preventiva_nav.html' %}
            {% include 'partials/perfil_boton.html' %}
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-4">
        {% if reporte.descripcion %}
        <p class="text-sm text-slate-400">{{ reporte.descripcion }}</p>
        {% endif %}

        <div class="w-full bg-slate-800 rounded-2xl shadow-md overflow-hidden border border-slate-700/60" style="height: 80vh;">
            <iframe
                title="{{ reporte.titulo }}"
                width="100%"
                height="100%"
                src="{{ reporte.embed_url }}"
                frameborder="0"
                allowfullscreen
                class="border-0">
            </iframe>
        </div>
    </main>
</body>
</html>
