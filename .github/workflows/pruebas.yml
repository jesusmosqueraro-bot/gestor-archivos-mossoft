name: Pruebas automáticas

# Corre en cada push y cada Pull Request a main — incluye los commits que llegan por la
# interfaz web de GitHub (Upload files), no solo los que se suben con `git push`. No depende
# de ningún acceso especial al repositorio: es infraestructura de GitHub, separada del entorno
# donde se generan los commits.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (producción + pruebas)
        run: pip install -r requirements-dev.txt

      - name: Verificar que app.py compila sin errores de sintaxis
        run: python -m py_compile app.py

      - name: Correr la suite de pruebas (pytest)
        env:
          # 🧪 Todas las pruebas usan sqlite local y descartable — nunca Postgres/producción.
          # Sin DATABASE_URL, get_db() cae automáticamente a sqlite (ver app.py).
          DESHABILITAR_RESPALDO_AUTOMATICO: '1'
        run: python -m pytest tests/ -v

  # 🚀 Verifica que static/css/tailwind.min.css (el CSS compilado que reemplazó a
  # cdn.tailwindcss.com, ver comentario junto al CSP en app.py) siga reflejando las clases que
  # usan las plantillas. Como no hay ningún paso de build en Render — el .css compilado se sirve
  # tal cual desde el repo — es fácil olvidarse de correr `npm run build:css` después de agregar
  # una clase de Tailwind nueva en un template; si eso pasa, esa clase quedaría sin estilo en
  # producción sin que nadie se diera cuenta. Este job recompila desde cero en un entorno limpio
  # y falla el check del PR si el resultado no es BYTE A BYTE igual al que está commiteado.
  css-tailwind-actualizado:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Tailwind CLI
        run: npm install

      - name: Recompilar static/css/tailwind.min.css
        run: npm run build:css

      - name: Falla si el resultado no coincide con lo commiteado
        run: |
          if ! git diff --quiet -- static/css/tailwind.min.css; then
            echo "::error::static/css/tailwind.min.css está desactualizado. Corre 'npm run build:css' localmente y sube el resultado."
            git diff --stat -- static/css/tailwind.min.css
            exit 1
          fi

  # 🔒 Hallazgo de auditoría de seguridad (06/09/2026): no había ningún escaneo de
  # dependencias — pip-audit revisa requirements.txt contra la base de datos pública de
  # vulnerabilidades conocidas (OSV) en cada push/PR a main. Es un job aparte del de pytest de
  # arriba para que un hallazgo de seguridad se vea como su propio check en el PR, sin mezclarse
  # con el resultado de las pruebas. No bloquea el auto-deploy de Render (que dispara con el
  # push, no con este resultado) — es una señal para revisar y actualizar la dependencia
  # marcada, no un despliegue detenido.
  auditoria-dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Escanear requirements.txt en busca de vulnerabilidades conocidas
        run: pip-audit -r requirements.txt --strict
